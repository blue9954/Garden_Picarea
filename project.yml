# XcodeGen 프로젝트 정의 — `brew install xcodegen && xcodegen generate` 후 Picarea.xcodeproj를 연다.
name: Picarea
options:
  bundleIdPrefix: com.garden
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  GardenCore:
    path: Packages/GardenCore
targets:
  Picarea:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    configFiles:
      Debug: App/Config/App.xcconfig
      Release: App/Config/App.xcconfig
    dependencies:
      - package: GardenCore
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Picarea
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: 현재 위치 주변의 출사지 추천과 일출·일몰·골든아워 계산에 위치를 사용합니다.
        NaverClientID: $(NAVER_CLIENT_ID)
        NaverClientSecret: $(NAVER_CLIENT_SECRET)
        KakaoRestAPIKey: $(KAKAO_REST_API_KEY)
        WeatherKitEnabled: $(WEATHERKIT_ENABLED)
    entitlements:
      path: App/Resources/Picarea.entitlements
      properties:
        com.apple.developer.weatherkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garden.picarea
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  Picarea:
    build:
      targets:
        Picarea: all
    test:
      targets:
        - package: GardenCore/GardenCoreTests
