name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: GardenCore 테스트 (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: GardenCore swift test
        working-directory: Packages/GardenCore
        run: swift test
      - name: 앱 로직 하네스 (ViewModel·설정)
        working-directory: Tools/AppLogicHarness
        run: swift test

  app-ios:
    name: iOS 앱 빌드 (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Picarea.xcodeproj -scheme Picarea \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -quiet
